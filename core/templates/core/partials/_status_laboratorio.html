<div class="card-pop border-2 border-black bg-white">
    <div class="bg-black text-white px-4 py-2 font-black flex items-center gap-2">
        <i class="fa-solid fa-building-shield"></i> STATUS DO LABORATÓRIO
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 divide-y-2 sm:divide-y-0 sm:divide-x-2 divide-black text-center">
        <div class="p-4">
            <span class="inline-flex items-center gap-2 px-3 py-1 font-black border-2 border-black {% if status_lab.aberto %}bg-emerald-400 pulse-soft{% else %}bg-red-400{% endif %}">
                <i class="fa-solid {% if status_lab.aberto %}fa-lock-open{% else %}fa-lock{% endif %}"></i>
                {% if status_lab.aberto %}ABERTO{% else %}FECHADO{% endif %}
            </span>
            <p class="text-xs font-bold text-gray-500 mt-2">LABORATÓRIO</p>
        </div>
        <div class="p-4">
            <p class="text-3xl font-black font-display counter-value">{{ status_lab.qtd_presentes }}</p>
            <p class="text-xs font-bold text-gray-500 mt-2">MEMBROS COM ENTRADA HOJE</p>
        </div>
        <div class="p-4">
            <p class="text-lg font-black flex items-center justify-center gap-2">
                <i class="fa-solid fa-calendar-check text-fuchsia-500"></i>
                {% if proximo_evento %}{{ proximo_evento.data|date:"d/m" }} — {{ proximo_evento.titulo }}{% else %}—{% endif %}
            </p>
            <p class="text-xs font-bold text-gray-500 mt-2">PRÓXIMO EVENTO</p>
        </div>
    </div>
</div>
