{% extends "base.html" %}
{% block title %}Projetos{% endblock %}
{% block content %}

<div class="flex items-center justify-between mb-4 flex-wrap gap-2 anim-fade-up">
    <span class="inline-flex items-center gap-2 bg-fuchsia-500 text-white font-black px-4 py-2 border-2 border-black rotate-badge">
        <i class="fa-solid fa-diagram-project"></i> PROJETOS — KANBAN
    </span>
    <div class="flex gap-2 flex-wrap">
        <a href="{% url 'projetos:lista_projetos' %}" class="btn-pop inline-flex items-center gap-2 bg-purple-500 text-white font-black px-4 py-2 border-2 border-black">
            <i class="fa-solid fa-folder-tree"></i> PROJETOS
        </a>
        {% if request.user.is_authenticated %}
        <a href="{% url 'projetos:nova_atividade' %}{% if projeto_id %}?projeto={{ projeto_id }}{% endif %}" class="btn-pop inline-flex items-center gap-2 bg-yellow-300 font-black px-4 py-2 border-2 border-black">
            <i class="fa-solid fa-plus"></i> NOVA ATIVIDADE
        </a>
        {% endif %}
    </div>
</div>

<form class="card-pop border-2 border-black bg-white p-3 mb-4 flex gap-3 flex-wrap items-center anim-fade-up"
      hx-get="{% url 'projetos:kanban' %}" hx-target="#kanban-colunas" hx-swap="outerHTML" hx-trigger="change" hx-indicator="#filtro-indicator">
    <label class="text-xs font-bold uppercase text-gray-500 flex items-center gap-1">
        <i class="fa-solid fa-filter"></i> Filtrar por projeto
    </label>
    <select name="projeto" class="flex-1 min-w-[200px] border-2 border-black px-3 py-2 focus:outline-none focus:shadow-brutal-fuchsia transition-all">
        <option value="">Todos os projetos</option>
        {% for projeto in projetos %}
        <option value="{{ projeto.pk }}" {% if projeto_id == projeto.pk|stringformat:"s" %}selected{% endif %}>{{ projeto.nome }}</option>
        {% endfor %}
    </select>
    <i class="fa-solid fa-spinner fa-spin htmx-indicator self-center text-fuchsia-500" id="filtro-indicator"></i>
</form>

{% include "projetos/partials/_kanban_colunas.html" %}

{% endblock %}
